[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "skytrack-autonomy-examples"
version = "0.1.0"
description = "Mission examples (simple to advanced) and guides for skytrack-autonomy, in the app's mission-file format."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "SkyTrack"}]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "skytrack-autonomy",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
